name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Autenticar e Fazer Deploy
        run: firebase deploy --only hosting --project mariliaja-94f23
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
        
      # Cria o arquivo temporário da chave de forma segura antes do deploy
      - name: Criar arquivo de chave
        if: always()
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTALMARILIAJA }}' > ./firebase-key.json
